name: PocketLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: 5.10
  PRODUCT_NAME: PocketLog

packages: {}

targets:
  PocketLog:
    type: application
    platform: iOS
    sources:
      - path: PocketLog
    info:
      path: PocketLog/Info.plist
      properties:
        CFBundleDisplayName: PocketLog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketlog
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_UNUserNotificationUsageDescription: "PocketLog sends daily reminders to keep your budget on track."
    entitlements:
      path: PocketLog/PocketLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.pocketlog
    dependencies:
      - target: PocketLogWidgetExtension
    scheme:
      testTargets: []

  PocketLogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: PocketLog/Shared
      - path: PocketLog/Models
      - path: PocketLog/Theme.swift
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: PocketLogWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketlog.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    entitlements:
      path: WidgetExtension/PocketLogWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.pocketlog
